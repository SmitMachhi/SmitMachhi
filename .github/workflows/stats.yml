name: stats card

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools==4.55.3

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -F query=@.github/scripts/query.graphql \
            -f login="$LOGIN" \
            -f merged="author:$LOGIN is:pr is:merged is:public" > data.json

      - run: python .github/scripts/card.py data.json stats .github/fonts

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || { git commit -m "Update stats card" && git push; }
